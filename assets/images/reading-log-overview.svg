<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">reading-log の仕組み</title>
  <desc id="desc">会話で入力し、GitHub に記録し、毎週読む順を見直し、GitHub Pages で見る。ChatGPT・Claude・Claude Code は同じ決まりで記録を更新する</desc>
  <rect width="1200" height="560" rx="28" fill="#f4f0e7"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif" fill="#18211d">
    <text x="56" y="92" font-size="34" font-weight="760">読書記録を次の 1 冊と行動につなげる</text>

    <!-- arrows between cards -->
    <g fill="#d66d3b">
      <path d="M326 280 l-12 -10 v20z"/>
      <path d="M606 280 l-12 -10 v20z"/>
      <path d="M886 280 l-12 -10 v20z"/>
    </g>

    <!-- 1 会話で入力 -->
    <g transform="translate(56 140)">
      <rect width="248" height="280" rx="18" fill="#fffdf7"/>
      <text x="24" y="50" font-size="24" font-weight="760">会話で入力</text>

      <g transform="translate(24 92)" stroke="#1e4f40" stroke-width="2.4" fill="none" stroke-linejoin="round">
        <path d="M2 4h34a7 7 0 0 1 7 7v35H9a7 7 0 0 0-7 7z"/>
        <path d="M2 4v49a7 7 0 0 1 7-7h34"/>
        <path d="M11 14h21M11 23h16" stroke="#d66d3b"/>
      </g>
      <text x="84" y="128" font-size="18" font-weight="700">本を登録</text>

      <g transform="translate(24 180)" stroke="#1e4f40" stroke-width="2.4" fill="none" stroke-linecap="round">
        <rect x="3" y="3" width="38" height="43" rx="5"/>
        <path d="M12 14h20M12 23h20M12 32h13" stroke="#d66d3b"/>
      </g>
      <text x="84" y="214" font-size="18" font-weight="700">進捗・感想</text>
    </g>

    <!-- 2 GitHub に記録 -->
    <g transform="translate(336 140)">
      <rect width="248" height="280" rx="18" fill="#fffdf7"/>
      <text x="24" y="50" font-size="24" font-weight="760">GitHub に記録</text>

      <rect x="24" y="86" width="200" height="164" rx="12" fill="#1e4f40"/>
      <text x="42" y="118" font-size="15" font-weight="700" fill="#fffdf7">reading-log</text>
      <g font-size="16" font-weight="600">
        <rect x="38" y="138" width="172" height="40" rx="8" fill="#fffdf7"/>
        <text x="54" y="164">books/</text>
        <rect x="38" y="192" width="172" height="40" rx="8" fill="#fffdf7"/>
        <text x="54" y="218">reviews/</text>
      </g>
    </g>

    <!-- 3 毎週読む順を見直す -->
    <g transform="translate(616 140)">
      <rect width="248" height="280" rx="18" fill="#fffdf7"/>
      <text x="24" y="50" font-size="24" font-weight="760">毎週読む順を見直す</text>

      <rect x="24" y="90" width="92" height="44" rx="22" fill="#eee8dc"/>
      <text x="70" y="118" text-anchor="middle" font-size="16" font-weight="700">目標</text>
      <rect x="132" y="90" width="92" height="44" rx="22" fill="#eee8dc"/>
      <text x="178" y="118" text-anchor="middle" font-size="16" font-weight="700">進み具合</text>

      <path d="M70 134v24h108v-24M124 158v26" stroke="#9aa29d" stroke-width="2.2" fill="none"/>
      <rect x="24" y="186" width="200" height="60" rx="14" fill="#1e4f40"/>
      <text x="124" y="224" text-anchor="middle" font-size="19" font-weight="760" fill="#fffdf7">次に読む 1 冊</text>
    </g>

    <!-- 4 Pages で見る -->
    <g transform="translate(896 140)">
      <rect width="248" height="280" rx="18" fill="#fffdf7"/>
      <text x="24" y="50" font-size="24" font-weight="760">Pages で見る</text>

      <rect x="24" y="86" width="200" height="164" rx="10" fill="#f4f0e7"/>
      <rect x="24" y="86" width="200" height="28" rx="10" fill="#1e4f40"/>
      <rect x="24" y="104" width="200" height="10" fill="#1e4f40"/>
      <circle cx="40" cy="100" r="3.5" fill="#fffdf7"/>
      <circle cx="52" cy="100" r="3.5" fill="#fffdf7"/>
      <circle cx="64" cy="100" r="3.5" fill="#fffdf7"/>
      <rect x="38" y="130" width="64" height="9" rx="4.5" fill="#d66d3b"/>
      <rect x="38" y="150" width="56" height="84" rx="6" fill="#fffdf7"/>
      <rect x="103" y="150" width="56" height="84" rx="6" fill="#fffdf7"/>
      <rect x="168" y="150" width="42" height="84" rx="6" fill="#fffdf7"/>
    </g>

    <!-- 同じ決まりで更新する AI -->
    <g transform="translate(56 462)" font-size="17" font-weight="700">
      <rect width="120" height="40" rx="20" fill="#fffdf7"/><text x="60" y="26" text-anchor="middle">ChatGPT</text>
      <rect x="132" width="104" height="40" rx="20" fill="#fffdf7"/><text x="184" y="26" text-anchor="middle">Claude</text>
      <rect x="248" width="146" height="40" rx="20" fill="#fffdf7"/><text x="321" y="26" text-anchor="middle">Claude Code</text>
      <path d="M418 20h40" stroke="#d66d3b" stroke-width="2.4"/>
      <path d="M470 20 l-12 -10 v20z" fill="#d66d3b"/>
      <rect x="486" width="200" height="40" rx="20" fill="#1e4f40"/><text x="586" y="26" text-anchor="middle" fill="#fffdf7">同じ決まりで記録</text>
    </g>
  </g>
</svg>
